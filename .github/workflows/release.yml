name: Windows manual release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manual-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validate release tag
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Run on a stable vVERSION tag matching package.json.' }
      - name: Build unsigned manual installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Create checksum and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "StudioAI-$version-Windows-x64.exe"
          $hash = (Get-FileHash "dist/$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installer" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          gh release create "v$version" "dist/$installer" dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --verify-tag --draft --title "StudioAI $version (unsigned)" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; existing releases were not overwritten.' }
      - uses: actions/upload-artifact@v4
        with:
          name: StudioAI-Windows-unsigned
          path: |
            desktop/dist/StudioAI-*-Windows-x64.exe
            desktop/dist/SHA256SUMS.txt
